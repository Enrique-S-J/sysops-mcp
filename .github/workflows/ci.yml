name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Both operating systems, deliberately. This server reads paths and mounts
    # whose behavior differs by platform, and it has already shipped two bugs
    # that were invisible on one OS: /var is a symlink to /private/var on
    # macOS, and Linux carries permanently-full squashfs snap mounts. Testing
    # on a single OS would have caught neither.
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every failing combination, not just the first.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest -v
