[project]
name = "sysops-mcp"
version = "0.1.0"
description = "MCP server exposing safe, read-only system diagnostics (CPU, memory, disk, processes, network, ports, logs) to AI assistants."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Enrique Sanchez" }]
keywords = ["mcp", "model-context-protocol", "diagnostics", "monitoring", "sysadmin", "ai-agents"]
dependencies = [
    # Written against the 2.x API (MCPServer, snake_case annotation fields).
    # 1.x exposed FastMCP instead, so the lower bound is not optional.
    "mcp>=2.0,<3",
    "psutil>=5.9.0,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.urls]
Repository = "https://github.com/Enrique-S-J/sysops-mcp"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
